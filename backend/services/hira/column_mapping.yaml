# 가정: 실제 HIRA 샘플이 없어 흔한 컬럼명으로 만든 별칭 목록.
# 실제 파일과 다르면 이 파일의 별칭만 고치면 된다. (공백/줄바꿈/대소문자/괄호 뒤 단위는 무시하고 비교)
header_scan_rows: 30   # 헤더를 찾기 위해 각 시트 위에서부터 훑는 행 수
min_header_matches: 2  # 헤더로 인정하려면 필요한 최소 별칭 매칭 수 (약품명 포함 필수)
fields:
  date: [진료일자, 진료일, 조제일자, 조제일, 처방일자, 처방일, 투약일자, 내원일자]
  product_name: [약품명, 약품명칭, 처방약품명, 처방의약품명, 의약품명, 약품, 제품명, 품명]
  drug_code: [약품코드, 보험코드, 약품기준코드, 품목기준코드, 제품코드]
  ingredient: [주성분명, 성분명, 주성분, 성분, 일반명, 일반명칭]
  strength: [함량, 규격, 약품규격]
  dose_per_time: [1회투약량, 1회투여량, 1회복용량, 1회용량]
  times_per_day: [1일투여횟수, 1일투약횟수, 1일복용횟수, 일투여횟수, 일투약횟수]
  total_days: [총투약일수, 총투여일수, 투약일수, 처방일수, 일수]
  institution: [요양기관명, 요양기관, 의료기관명, 병원명, 약국명, 기관명]
